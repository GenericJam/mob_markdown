buildscript {
    repositories { google(); mavenCentral() }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
    }
}

repositories { google(); mavenCentral() }

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'io.mob.markdown.ci'
    compileSdk 35
    defaultConfig { minSdk 28 }
    sourceSets { main { java.srcDirs = ['../../priv/native/android'] } }
    buildFeatures { compose true }
    composeOptions { kotlinCompilerExtensionVersion '1.5.8' }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
        allWarningsAsErrors = true
    }
}

// The Markwon coordinates come from the manifest, so the two can't drift.
def manifest = file('../../priv/mob_plugin.exs').text
def markwon = (manifest =~ /"(io\.noties\.markwon:[^"]+)"/).collect { it[1] }
if (markwon.isEmpty()) throw new GradleException('no Markwon gradle_deps in priv/mob_plugin.exs')

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.core:core-ktx:1.12.0'
    markwon.each { implementation it }
}
