name: tests

# CI for the plugin: the Elixir gate mob core runs, plus compile checks for
# the native view on both platforms. The host app's native build is what
# ships them; a device is what proves them.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: '1.19'
            otp: '28'
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps + _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: mix-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-

      - run: mix deps.get
      - run: mix deps.compile
      - run: mix compile --warnings-as-errors

      - name: Format check
        run: mix format --check-formatted

      - name: Credo (strict)
        run: mix credo --strict

      - name: Tests
        run: mix test

      - name: Validate the manifest
        run: mix mob.validate_plugin

  # ci/android: an Android library over priv/native/android with mob_new's
  # template versions and the manifest's Markwon deps.
  native-android:
    name: Android view compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'
      - name: compileDebugKotlin (warnings are errors)
        run: gradle -p ci/android compileDebugKotlin --console=plain

  native-ios:
    name: iOS view compiles
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: swiftc -typecheck against the iOS simulator SDK
        run: |
          xcrun --sdk iphonesimulator swiftc -typecheck -warnings-as-errors \
            -target arm64-apple-ios17.0-simulator \
            -import-objc-header ci/ios/Bridging-Header.h \
            priv/native/ios/MobMarkdownView.swift
